[build-system]
# setuptools>=77 for PEP 639 license / license-files keys.
requires      = ["setuptools>=77", "cffi>=1.16"]
build-backend = "setuptools.build_meta"

[project]
name            = "nyxstone-tricore-gcc"
version         = "0.2.1"
description     = "In-process TriCore assembler/disassembler, Python bindings around binutils-tricore (gas + libopcodes)."
readme          = "README.md"
license         = "GPL-3.0-or-later"
license-files   = ["LICENSE"]
requires-python = ">=3.8"
dependencies    = ["cffi>=1.16"]
authors         = [{ name = "emproof" }]
keywords        = ["tricore", "assembler", "disassembler", "embedded", "infineon", "binutils"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    # License is declared via the SPDX expression above (PEP 639); license
    # classifiers are deprecated alongside it.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Assemblers",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Embedded Systems",
]

[project.urls]
Homepage      = "https://github.com/emproof-com/NyxstoneTricoreGCC"
Repository    = "https://github.com/emproof-com/NyxstoneTricoreGCC"
Issues        = "https://github.com/emproof-com/NyxstoneTricoreGCC/issues"
Documentation = "https://github.com/emproof-com/NyxstoneTricoreGCC#readme"

[tool.setuptools]
packages = ["nyxstone_tricore_gcc"]

# The native extension is declared in setup.py via cffi_modules
# (build_native.py:ffibuilder) plus a build_ext subclass that extracts the
# bundled binutils-tricore prebuilts at build time.
